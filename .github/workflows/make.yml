name: Make video

# Push a film (films/<name>/film.json) to main and GitHub does the rest:
#   1. prepare : pulls the film's footage from its Release, hunts what the cloud can reach
#                (Internet Archive, Dailymotion, TMDB, Commons, Google Images; YouTube usually blocks
#                GitHub, so run the laptop hunt for those), screenshots pages, cuts your voiceover
#                into beats, saves everything, checks the rules, plans the render
#   2. render  : up to 18 machines render one piece of the picture each, at the same time
#   3. finish  : joins the pieces, mixes and masters the audio, writes the credits, uploads the MP4
# Or run it by hand: Actions -> Make video -> Run workflow.

on:
  push:
    branches: [main]
    paths: ['films/*/film.json', 'films/*/vo/voice.*']
  workflow_dispatch:
    inputs:
      film:
        description: Film folder name (films/<name>)
        required: true
      quality:
        description: final = 1080p and every shot must be found. draft = 540p, missing shots show as red cards
        type: choice
        options: [final, draft]
        default: final
      hunt:
        description: Search for missing footage from GitHub first
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: make-${{ inputs.film || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      film: ${{ steps.pick.outputs.film }}
      sha: ${{ steps.save.outputs.sha }}
      chunks: ${{ steps.chunks.outputs.chunks }}
      scale: ${{ steps.check.outputs.scale }}
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: pick
        env:
          INPUT_FILM: ${{ inputs.film }}
          QUALITY: ${{ inputs.quality || 'final' }}
        run: |
          if [ -n "$INPUT_FILM" ]; then film="$INPUT_FILM"
          else
            base=$(git rev-parse -q --verify HEAD~1 || git hash-object -t tree /dev/null)
            film=$(git diff --name-only "$base" HEAD -- 'films/*' | grep -v '^films/_' | head -1 | cut -d/ -f2)
          fi
          [ -n "$film" ] && [ -f "films/$film/film.json" ] || { echo "::error::No film found (films/$film/film.json)"; exit 1; }
          echo "film=$film" >> "$GITHUB_OUTPUT"
          if [ "$QUALITY" = "draft" ]; then echo "scale=0.5" >> "$GITHUB_OUTPUT"; else echo "scale=1" >> "$GITHUB_OUTPUT"; fi
          echo "Film: $film ($QUALITY)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg poppler-utils fonts-liberation tesseract-ocr > /dev/null
          npm ci --no-audit --no-fund
          pip install -q -r hunt/requirements.txt

      - name: Pull footage from the film's release
        run: node scripts/assets.mjs pull "films/${{ steps.pick.outputs.film }}"

      - name: Hunt footage (what GitHub can reach)
        if: inputs.hunt != false
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          HUNT_PROXY: ${{ secrets.HUNT_PROXY }}
        run: python hunt/hunt.py "films/${{ steps.pick.outputs.film }}"

      - name: Page screenshots
        continue-on-error: true
        run: node scripts/receipts.mjs "films/${{ steps.pick.outputs.film }}"

      - name: Voiceover (your recording, or a Deepgram voice when film.json has "voice") cut into beats
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          f="films/${{ steps.pick.outputs.film }}"
          [ -n "$DEEPGRAM_API_KEY" ] && node scripts/vo_tts.mjs "$f"
          if ! ls "$f"/vo/voice.* >/dev/null 2>&1; then echo "::warning::No vo/voice.* yet: rendering on estimated timing, no narration"; exit 0; fi
          if [ -z "$DEEPGRAM_API_KEY" ]; then echo "::error::Add the DEEPGRAM_API_KEY secret to cut the voiceover"; exit 1; fi
          node scripts/align.mjs "$f"

      - name: Save footage to the release and the film to the repo
        id: save
        run: |
          f="films/${{ steps.pick.outputs.film }}"
          node scripts/assets.mjs push "$f"
          node scripts/credits.mjs "$f"
          git config user.name "archive-engine bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$f/film.json" "$f/credits.md"
          ls "$f"/vo/voice.* >/dev/null 2>&1 && git add "$f"/vo/voice.*
          if ! git diff --cached --quiet; then
            git commit -q -m "make: footage and voice for ${{ steps.pick.outputs.film }} [skip ci]"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the rules
        id: check
        run: |
          film="films/${{ steps.pick.outputs.film }}"
          scale="${{ steps.pick.outputs.scale }}"
          extra=""; [ "$scale" = "0.5" ] && extra="--allow-missing"
          if node scripts/validate.mjs "$film" $extra > validate.txt; then echo "go=yes" >> "$GITHUB_OUTPUT"
          elif node scripts/validate.mjs "$film" --allow-missing > validate.txt; then
            # footage still missing: render a 540p draft anyway (missing shots show as red cards)
            echo "go=yes" >> "$GITHUB_OUTPUT"; scale=0.5; echo "DRAFT: footage missing, rendering a 540p draft" >> validate.txt
          else echo "go=no" >> "$GITHUB_OUTPUT"; fi
          echo "scale=$scale" >> "$GITHUB_OUTPUT"
          cat validate.txt
          {
            echo "## ${{ steps.pick.outputs.film }}"
            if grep -q "no asset yet" validate.txt; then
              echo "### Footage still missing"
              echo "GitHub could not get these (YouTube blocks cloud machines). On your laptop run:"
              echo '```'
              echo ".\\hunt\\run.ps1 ${{ steps.pick.outputs.film }}"
              echo '```'
              echo "It finds the rest, uploads it, and this workflow starts again by itself. Or run the workflow with quality = draft to see the video now."
            fi
            echo '```'
            cat validate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan the parallel render
        id: chunks
        if: steps.check.outputs.go == 'yes'
        run: echo "chunks=$(node scripts/plan_chunks.mjs films/${{ steps.pick.outputs.film }})" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: needs.prepare.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          npm ci --no-audit --no-fund
          node scripts/assets.mjs pull "films/${{ needs.prepare.outputs.film }}"
      - name: Render frames ${{ matrix.chunk.frames }}
        run: |
          export REMOTION_CONCURRENCY=$(nproc)
          node scripts/render.mjs "films/${{ needs.prepare.outputs.film }}" --frames ${{ matrix.chunk.frames }} \
            --scale ${{ needs.prepare.outputs.scale }} --chunk 600 --out out/part-${{ matrix.chunk.i }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.i }}
          path: out/part-${{ matrix.chunk.i }}.mp4
          retention-days: 1

  finish:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          node scripts/assets.mjs pull "films/${{ needs.prepare.outputs.film }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: out/parts
          merge-multiple: true
      - name: Join, mix and master
        run: |
          film=${{ needs.prepare.outputs.film }}
          ls out/parts/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > out/list.txt
          ffmpeg -loglevel error -y -f concat -safe 0 -i out/list.txt -c copy "out/$film.video.mp4"
          node scripts/mix.mjs "films/$film" --video "out/$film.video.mp4" --out "out/$film.mp4"
          node scripts/contact_sheet.mjs "out/$film.mp4" --every 6 --cols 6
          node scripts/credits.mjs "films/$film"
          cp "films/$film/credits.md" out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.film }}
          path: |
            out/${{ needs.prepare.outputs.film }}.mp4
            out/${{ needs.prepare.outputs.film }}.sheet.jpg
            out/${{ needs.prepare.outputs.film }}.description.txt
            out/credits.md
          retention-days: 14
      - name: Summary
        run: |
          f="out/${{ needs.prepare.outputs.film }}.mp4"
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "### Done: ${{ needs.prepare.outputs.film }}.mp4 ($(du -h "$f" | cut -f1), $(printf '%.0f' "$d") s)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it, the contact sheet and the YouTube credits text from **Artifacts** below." >> "$GITHUB_STEP_SUMMARY"
